name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: Zero
        runs-on: ubuntu-26.04
        env:
            CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Build Stage 2 compiler
              run: make -s stage-2
