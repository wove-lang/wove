name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: Zero
        runs-on: ubuntu-26.04
        env:
            CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Build Stage 2 compiler
              run: make -s stage-2

    build:
        name: Build / ${{ matrix.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        needs: check
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux x86
                      runner: ubuntu-26.04
                    - name: Linux ARM
                      runner: ubuntu-26.04-arm
                    - name: macOS ARM
                      runner: macos-15
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Build Stage 2 compiler
              env:
                  CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
              run: make -s stage-2
            - name: Build final compiler
              run: make -s all
