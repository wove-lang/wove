name: CI

on:
    push:
        branches: [master]
    pull_request:
    schedule:
        - cron: '17 3 * * *'

permissions:
    contents: read

jobs:
    check:
        name: Zero
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-26.04
        env:
            CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Build Stage 2 compiler
              run: make stage-2

    build:
        name: Build / ${{ matrix.name }}
        if: github.event_name == 'schedule'
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Release / Linux x86
                      runner: ubuntu-26.04
                      kind: compiler
                    - name: Release / Linux ARM
                      runner: ubuntu-26.04-arm
                      kind: compiler
                    - name: Release / macOS ARM
                      runner: macos-15
                      kind: compiler
                    - name: Support / VS Code
                      runner: ubuntu-26.04
                      kind: vscode
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Build Stage 2 compiler
              if: matrix.kind == 'compiler'
              env:
                  CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
              run: make stage-2
            - name: Build final compiler
              if: matrix.kind == 'compiler'
              run: make all
            - uses: actions/setup-node@v7.1.0
              if: matrix.kind == 'vscode'
              with:
                  node-version: '24'
            - name: Build VS Code extension
              if: matrix.kind == 'vscode'
              run: make -s vscode

    test:
        name: Test / ${{ matrix.name }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-26.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Bootstrap
                      target: test-stage-1
                    - name: Language
                      target: test-stage-2-language
                    - name: Utilities
                      target: test-stage-2-utilities
                    - name: Native CLI
                      target: test-stage-2-native-cli
                    - name: C Interop
                      target: test-stage-2-interop
                    - name: Runtime
                      target: test-stage-2-runtime
                    - name: Self-host
                      target: test-stage-2-self-host
        env:
            CFLAGS: -O1 -fno-inline-functions -Wall -Wextra
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Run ${{ matrix.name }} tests
              env:
                  WOVE_CI_TEST_TARGET: ${{ matrix.target }}
              run: make -s -j"$(nproc)" --output-sync=target "$WOVE_CI_TEST_TARGET"
